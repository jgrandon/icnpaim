name: Deploy PAIM App to RHEL 10

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to RHEL 10 Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ${{ secrets.APP_PATH }}
            git pull origin main
            npm install --production
            npm run build
            pm2 stop ICNPAIM
            pm2 delete ICNPAIM
            sudo rm -r /var/www/icnpaim
            sudo cp -r ${{ secrets.APP_PATH }} /var/www
            sudo chown -R nginx:nginx /var/www/icnpaim
            sudo chcon -Rt httpd_sys_content_t /var/www/icnpaim/public
            pm2 start /var/www/icnpaim/server/lib/server.js --name "ICNPAIM"
            pm2 startup
            sudo systemctl restart nginx